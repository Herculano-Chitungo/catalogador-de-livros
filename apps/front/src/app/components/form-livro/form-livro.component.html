<div style="padding: 24px; max-width: 600px; margin: 0 auto;">
  <h2>{{ isEdicao ? 'Editar Livro' : 'Cadastrar Novo Livro' }}</h2>
  
  <div *ngIf="mensagemErro" style="background-color: #ffebee; color: #c62828; padding: 10px; border-radius: 4px; margin-bottom: 16px;">
    {{ mensagemErro }}
  </div>

  <form (ngSubmit)="salvar()" style="display: flex; flex-direction: column; gap: 16px; margin-top: 10px;">
    
    <div>
      <label style="display: block; margin-bottom: 6px; font-weight: 500;">Título *</label>
      <input type="text" [(ngModel)]="livro.titulo" name="titulo" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div>
      <label style="display: block; margin-bottom: 6px; font-weight: 500;">Autor *</label>
      <input type="text" [(ngModel)]="livro.autor" name="autor" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div>
      <label style="display: block; margin-bottom: 6px; font-weight: 500;">Categoria *</label>
      <input type="text" [(ngModel)]="livro.categoria" name="categoria" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div>
      <label style="display: block; margin-bottom: 6px; font-weight: 500;">Preço *</label>
      <input type="number" step="0.01" [(ngModel)]="livro.preco" name="preco" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="display: flex; gap: 12px; margin-top: 10px;">
      <button type="submit" style="padding: 10px 20px; background-color: #3f51b5; color: white; border: none; border-radius: 4px; cursor: pointer;">Salvar</button>
      <button type="button" routerLink="/home" style="padding: 10px 20px; background-color: transparent; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">Cancelar</button>
    </div>
  </form>
</div>
